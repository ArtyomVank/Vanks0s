# Vanks Setup: VanksSetup.exe (Windows), vanks-setup-linux-x86_64 и
# vanks-setup.pyz. Запуск вручную (Actions → Vanks Setup → Run workflow) —
# файлы в артефактах сборки; при публикации релиза — ещё и в сам релиз.
name: Vanks Setup

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сборка
        run: setup/build.sh
      - name: .pyz
        if: runner.os == 'Linux'
        run: tools/build-setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vanks-setup-${{ runner.os }}
          path: |
            dist/VanksSetup.exe
            dist/vanks-setup-linux-x86_64
            dist/vanks-setup.pyz
          if-no-files-found: ignore
      - name: В релиз
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/VanksSetup.exe dist/vanks-setup-linux-x86_64 dist/vanks-setup.pyz; do
            [ -f "$f" ] && gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
          done
