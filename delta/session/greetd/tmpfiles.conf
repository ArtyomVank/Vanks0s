# Delta — каталоги экрана входа. Ставится в /usr/lib/tmpfiles.d/delta-greeter.conf.
#
# /var/lib/delta-greeter/users — sticky и без чтения для всех (1733): каждый
# пользователь создаёт только свой каталог (delta-greeter-sync), чужие не видит
# и не может изменить. Greeter принимает каталог, только если его владелец —
# пользователь с тем же именем.
d /var/lib/delta-greeter                0755 root    root    -
d /var/lib/delta-greeter/users          1733 root    root    -
# состояние greeter'а: последний пользователь и сессия, settings.json выбранного пользователя
d /var/cache/delta-greeter              0755 greeter greeter -
d /var/cache/delta-greeter/config       0755 greeter greeter -
d /var/cache/delta-greeter/config/delta 0755 greeter greeter -
