# Delta — экрану входа (пользователь greeter) звук не нужен.
# Ставится в /usr/lib/systemd/user/<pipewire|pipewire-pulse|wireplumber>.{socket,service}.d/.
#
# Свой WirePlumber у greeter'а не может сохранить состояние (HOME=/) и
# выставлял звуковой карте громкость по умолчанию — 40 %. После выхода и
# нового входа она такой и оставалась. Без PipeWire у greeter'а громкость
# звуковой карты меняет только сессия пользователя.
[Unit]
ConditionUser=!greeter
