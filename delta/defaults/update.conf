# Delta — откуда приходят обновления самой Delta (delta-update).
#
# Пакета delta нет в репозиториях Arch: новые версии выкладываются файлом
# delta-<версия>-1-any.pkg.tar.zst в релизы GitHub (tools/delta-release.sh).
# Здесь — «владелец/репозиторий» на GitHub, например "ArtyomVank/Vanks0s".
# Пусто — обновляется только Arch. Своё значение: /etc/delta/update.conf.
DELTA_REPO="ArtyomVank/Vanks0s"
