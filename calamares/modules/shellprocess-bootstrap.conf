# Шаг 1: базовая система через pacstrap.
# dontChroot: true — команда выполняется в live-системе, ${ROOT} = точка монтирования цели.
---
dontChroot: true
timeout: 3600
verbose: true

i18n:
    name: "Установка базовой системы"
    name[ru]: "Установка базовой системы"

script:
    - command: "/usr/local/lib/vankos/bootstrap.sh ${ROOT}"
      timeout: 3600
