# Шаг 2: выбранная оболочка + настройка служб.
# ${gs[packagechooser_shell]} — значение, записанное экраном выбора оболочки.
---
dontChroot: true
timeout: 2400
verbose: true

i18n:
    name: "Установка рабочего стола"
    name[ru]: "Установка рабочего стола"

script:
    - command: "/usr/local/lib/vankos/desktop.sh ${ROOT} \"${gs[packagechooser_shell]}\""
      timeout: 2400
