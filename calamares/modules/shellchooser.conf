# Экран «Выбор рабочего стола» (модуль packagechooser, instance = shell).
# Выбор попадает в GlobalStorage как packagechooser_shell и читается
# скриптом /usr/local/lib/vankos/desktop.sh через ${gs[packagechooser_shell]}.
---
mode: required
method: legacy

labels:
    step: "Рабочий стол"
    step[ru]: "Рабочий стол"
    step[en]: "Desktop"

default: delta

items:
    - id: delta
      name: "Delta"
      name[ru]: "Delta"
      description: >-
          Новое графическое окружение Vanks OS на собственном композиторе, без
          Hyprland: окна с линзой и размытием, анимация сборки, перетаскивание на
          полной частоте экрана. Не поднялось на этой видеокарте — откроется Hyprland.
      description[ru]: >-
          Новое графическое окружение Vanks OS на собственном композиторе, без
          Hyprland: окна с линзой и размытием, анимация сборки, перетаскивание на
          полной частоте экрана. Не поднялось на этой видеокарте — откроется Hyprland.
      screenshot: "delta.png"

    - id: delta-hyprland
      name: "Hyprland"
      name[ru]: "Hyprland"
      description: >-
          Та же оболочка Delta на обычном Hyprland, как в версиях 0.x. Проверенный
          вариант. Новая Delta остаётся в списке сессий на экране входа.
      description[ru]: >-
          Та же оболочка Delta на обычном Hyprland, как в версиях 0.x. Проверенный
          вариант. Новая Delta остаётся в списке сессий на экране входа.
      screenshot: "delta.png"

    - id: gnome
      name: "GNOME"
      name[ru]: "GNOME"
      description: >-
          Классический рабочий стол GNOME: обзор активностей, док, тёмная тема,
          жесты тачпада. Вход через GDM. Запасной вариант — если нужна
          привычная система «из коробки» или Delta не подошла видеокарте.
      description[ru]: >-
          Классический рабочий стол GNOME: обзор активностей, док, тёмная тема,
          жесты тачпада. Вход через GDM. Запасной вариант — если нужна
          привычная система «из коробки» или Delta не подошла видеокарте.
      screenshot: "gnome.png"
