# Vanks OS — разметка диска.
# Точка монтирования ESP — /boot/efi (соглашение Arch), поэтому GRUB
# кладёт свои файлы в ESP, а ядро остаётся в /boot на корневом разделе.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        300MiB
    label:              "VANKOS_EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType: "ext4"
luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
lvm:
    enable: false

essentialMounts: [ "live-*", "control", "ventoy" ]
