# Vanks OS — загрузчик: GRUB для UEFI и BIOS.
# systemd-boot сознательно не выбран: GRUB надёжнее работает с ESP на /boot/efi
# и умеет находить другие системы (os-prober).
---
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
  - "timeout 5"
  - "console-mode keep"

# тихая загрузка: без сообщений udev/systemd и мигающего курсора консоли
kernelParams: [ "quiet", "loglevel=3", "rd.udev.log_level=3", "systemd.show_status=auto", "vt.global_cursor_default=0" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
installHybridGRUB: false
