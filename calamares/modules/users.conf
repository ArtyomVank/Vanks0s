# Vanks OS — модуль users: группы, sudo, автовход.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - audio
    - input
    - render
    - storage
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
autologinGroup: autologin

setRootPassword: true
doReusePassword: true
displayAutologin: true
doAutologin: false

passwordRequirements:
    minLength: 6
    maxLength: 64

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root, vankos, live ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "vanks-${cpu}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
