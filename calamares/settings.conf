# Vanks OS — конфигурация Calamares.
# Ключи и имена модулей сверены с upstream-примером settings.conf (ветка calamares).
---
modules-search: [ local ]

instances:
  # Наш экран выбора оболочки — стандартный packagechooser с брендингом Vanks OS.
  # method: legacy только записывает выбор в GlobalStorage (packagechooser_shell),
  # а установку пакетов делает наш скрипт desktop.sh — так поведение полностью
  # предсказуемо и не зависит от модуля packages.
  - id: shell
    module: packagechooser
    config: shellchooser.conf

  - id: bootstrap
    module: shellprocess
    config: shellprocess-bootstrap.conf

  - id: desktop
    module: shellprocess
    config: shellprocess-desktop.conf

  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser@shell
      - summary

  - exec:
      - partition
      - mount
      # 1. Ставим базовую систему через pacstrap (офлайн-репозиторий с ISO или сеть).
      - shellprocess@bootstrap
      # 2. Ставим выбранную оболочку и включаем нужные службы.
      - shellprocess@desktop
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - users
      - networkcfg
      - hwclock
      - bootloader
      # 3. Убираем за собой: отмонтируем репозиторий, чистим служебные файлы.
      - shellprocess@cleanup
      - umount

  - show:
      - finished

branding: vankos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
