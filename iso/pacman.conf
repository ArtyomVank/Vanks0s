#
# pacman.conf для сборки образа Vanks OS.
# build.sh подставляет сюда реальный CacheDir, поэтому пакеты, скачанные
# при сборке, остаются в build/pacman-cache и потом превращаются
# в локальный офлайн-репозиторий на ISO.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
# @@VANKOS_CACHEDIR@@
CheckSpace
ParallelDownloads = 5

SigLevel         = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
