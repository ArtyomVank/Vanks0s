title    Vanks OS 0.4 - Safe mode (installer only, basic graphics)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nomodeset vankos.safe=1 %KERNEL_PARAMS%
