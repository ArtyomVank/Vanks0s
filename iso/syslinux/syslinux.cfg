# Vanks OS — BIOS-загрузка (syslinux, ISO9660 и USB).
# После 5 секунд грузится первый пункт: live-система Delta целиком копируется
# в оперативную память (copytoram=y). Безопасный режим — только установщик
# с программной отрисовкой (nomodeset, cage + pixman), для любых видеокарт.
# vga=791 (1024x768) даёт ядру кадровый буфер VESA вместо драйвера видеокарты.
#
# ВАЖНО: текст меню — только ASCII. Ни systemd-boot, ни syslinux не умеют
# рисовать кириллицу: русские подписи превращаются в пустые места.

# Текстовое меню (menu.c32 mkarchiso копирует из пакета syslinux): иначе
# второй и третий пункт можно выбрать только вслепую, набрав метку.
UI menu.c32
MENU TITLE Vanks OS 0.4
DEFAULT vankos
PROMPT 0
TIMEOUT 50

LABEL vankos
    MENU LABEL Vanks OS - Delta live (runs in RAM)
    SAY Vanks OS: loading live system into RAM...
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y %KERNEL_PARAMS%

LABEL vankos-noram
    MENU LABEL Vanks OS - Delta live (no RAM copy, low memory)
    SAY Vanks OS: loading without RAM copy (low memory)...
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n %KERNEL_PARAMS%

LABEL vankos-safe
    MENU LABEL Safe mode - installer only, basic graphics
    SAY Vanks OS: safe mode, installer only (basic graphics)...
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nomodeset vga=791 vankos.safe=1 %KERNEL_PARAMS%
