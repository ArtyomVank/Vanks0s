# Vanks OS — конфигурация initramfs для live-ISO.
#
# Файл обязателен: без хуков archiso initramfs не умеет находить ISO,
# не выставляет root= и загрузка падает в emergency mode
# ("Timed out waiting for device /dev/gpt-auto-root").
# Содержимое повторяет configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
